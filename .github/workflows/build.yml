name: Build NoFall Bypass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and build addon
        run: ./gradlew --no-daemon clean test build
      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: nofallbypass-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
